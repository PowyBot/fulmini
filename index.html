<!doctype html>

<body>
<canvas id="c"></canvas>
<div class="hint" id="hint">tocca per una nuova scarica</div>
<div class="bar">
  <label title="esponente di ramificazione: basso = cespuglio, alto = fulmine">η <input id="slider" type="range" min="0.5" max="5" step="0.1"> <span id="eta"></span></label>
  <a href="#" id="sound" title="il tuono calcolato dalla forma del fulmine: tu sei a 1 km, in basso al centro">🔇 tuono</a>
  <a href="https://github.com/PowyBot/fulmini">sorgente</a>
  <a href="/">powy</a>
</div>
<script>
'use strict';
// Lichtenberg figures with the dielectric breakdown model (Niemeyer, Pietronero, Wiesmann 1984,
// https://doi.org/10.1103/PhysRevLett.52.1033): the discharge is held at potential 0 and the
// border at 1; after solving Laplace's equation, the discharge grows into a neighbor cell with
// probability proportional to the local field to the power eta. Touching the border ends it.

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const slider = document.getElementById('slider');
const etaLabel = document.getElementById('eta');
const hint = document.getElementById('hint');

const FREE = 0, CLUSTER = 1, BORDER = 2;

const MAX_CELLS = 42000;  // keeps one relaxation sweep cheap enough for a phone
const LOCAL_RADIUS = 14;
const LOCAL_SWEEPS = 6;
const GLOBAL_SWEEP_EVERY = 6;
// Successive over-relaxation factor: 1 is plain Gauss-Seidel (too slow), 2 diverges.
// 1.85 was picked by eye, below the theoretical optimum (~1.97 at these grid sizes).
const OMEGA = 1.85;
const FRAME_BUDGET_MS = 9;
const GROWTHS_PER_SECOND = 900;

let W, H, phi, kind, parent, order, cand, candPos, rng, eta, src, done, steps, strike;
let cssW, cssH, dpr, cell, offX, offY, flash = 0, fadeT = 0, mainChannel = null, downstream = null;

// mulberry32 by Tommy Ettinger, via https://github.com/bryc/code/blob/master/jshash/PRNGs.md
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function readParams() {
  const q = new URLSearchParams(location.search);
  const num = (k, d) => { const v = parseFloat(q.get(k)); return Number.isFinite(v) ? v : d; };
  const grid = (q.get('g') || '').split('x').map(Number);
  return {
    seed: (num('s', Math.floor(Math.random() * 1e9)) >>> 0),
    eta: Math.min(5, Math.max(0.5, num('eta', 1.6))),
    x: Math.min(0.95, Math.max(0.05, num('x', 0.5))),
    y: Math.min(0.95, Math.max(0.05, num('y', 0.5))),
    grid: grid.length === 2 && grid[0] >= 40 && grid[1] >= 40 && grid[0] * grid[1] <= 90000 ? grid : null,
  };
}

let params = readParams();

function writeParams() {
  const q = `?s=${params.seed}&eta=${params.eta.toFixed(1)}&x=${params.x.toFixed(3)}&y=${params.y.toFixed(3)}&g=${W}x${H}`;
  history.replaceState(null, '', location.pathname + q);
}

function gridFor(w, h) {
  const c = Math.max(3, Math.sqrt(w * h / MAX_CELLS));
  return [Math.round(w / c), Math.round(h / c)];
}

function layout() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  cssW = window.innerWidth; cssH = window.innerHeight;
  canvas.width = Math.round(cssW * dpr); canvas.height = Math.round(cssH * dpr);
  // A shared link keeps its original grid so the figure is reproducible; letterbox it.
  cell = Math.min(canvas.width / W, canvas.height / H);
  offX = (canvas.width - W * cell) / 2; offY = (canvas.height - H * cell) / 2;
}

function start() {
  if (!params.grid) params.grid = gridFor(window.innerWidth, window.innerHeight);
  [W, H] = params.grid;
  layout();
  eta = params.eta;
  rng = mulberry32(params.seed);
  const n = W * H;
  phi = new Float32Array(n); kind = new Uint8Array(n); parent = new Int32Array(n).fill(-1);
  candPos = new Int32Array(n).fill(-1); cand = []; order = [];
  done = false; steps = 0; strike = -1; stopThunder(); mainChannel = null; downstream = null; flash = 0; fadeT = 0;
  const sx = Math.round(params.x * (W - 1)), sy = Math.round(params.y * (H - 1));
  src = sy * W + sx;
  // Start from the 2D point-charge solution (log r) so a few hundred sweeps are enough.
  const R = Math.hypot(Math.max(sx, W - sx), Math.max(sy, H - sy));
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x;
    if (x === 0 || y === 0 || x === W - 1 || y === H - 1) { phi[i] = 1; kind[i] = BORDER; continue; }
    const r = Math.max(1, Math.hypot(x - sx, y - sy));
    phi[i] = Math.min(1, Math.log(r) / Math.log(R));
  }
  for (let k = 0; k < 250; k++) sweep(1, 1, W - 2, H - 2);
  addToCluster(src, -1);
  writeParams();
  slider.value = eta; etaLabel.textContent = eta.toFixed(1);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
}

// Red-black ordering: cells of one color only read cells of the other, so updates in place are safe.
function sweep(x0, y0, x1, y1) {
  for (let color = 0; color < 2; color++) {
    for (let y = y0; y <= y1; y++) {
      let x = x0 + ((x0 + y + color) & 1);
      for (let i = y * W + x; x <= x1; x += 2, i += 2) {
        if (kind[i] !== FREE) continue;
        const avg = 0.25 * (phi[i - 1] + phi[i + 1] + phi[i - W] + phi[i + W]);
        phi[i] += OMEGA * (avg - phi[i]);
      }
    }
  }
}

// Approximation: only the window around the new tip is solved properly; far cells catch up
// at the next global sweep. Exact solving after every growth would be too slow on a phone.
function relaxAround(i) {
  const x = i % W, y = (i / W) | 0;
  const x0 = Math.max(1, x - LOCAL_RADIUS), x1 = Math.min(W - 2, x + LOCAL_RADIUS);
  const y0 = Math.max(1, y - LOCAL_RADIUS), y1 = Math.min(H - 2, y + LOCAL_RADIUS);
  for (let k = 0; k < LOCAL_SWEEPS; k++) sweep(x0, y0, x1, y1);
}

const N8 = [];
function neighbors(i) {
  N8.length = 0;
  const x = i % W, y = (i / W) | 0;
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    if (!dx && !dy) continue;
    const nx = x + dx, ny = y + dy;
    if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
    N8.push(ny * W + nx);
  }
  return N8;
}

function removeCandidate(i) {
  const p = candPos[i];
  if (p < 0) return;
  const last = cand.pop();
  if (last !== i) { cand[p] = last; candPos[last] = p; }
  candPos[i] = -1;
}

function addToCluster(i, from) {
  removeCandidate(i);
  kind[i] = CLUSTER; phi[i] = 0; parent[i] = from; order.push(i);
  for (const j of neighbors(i)) {
    if (kind[j] === CLUSTER || candPos[j] >= 0) continue;
    if (kind[j] === BORDER) { if (strike < 0) strike = i; continue; }
    candPos[j] = cand.length; cand.push(j);
  }
}

function touchesClusterOrthogonally(i) {
  const x = i % W;
  return kind[i - W] === CLUSTER || kind[i + W] === CLUSTER
    || (x > 0 && kind[i - 1] === CLUSTER) || (x < W - 1 && kind[i + 1] === CLUSTER);
}

function pickParent(i) {
  const x = i % W;
  const ortho = [i - W, i + W, x > 0 ? i - 1 : -1, x < W - 1 ? i + 1 : -1];
  const options = [];
  for (const j of ortho) if (j >= 0 && kind[j] === CLUSTER) options.push(j);
  if (!options.length) for (const j of neighbors(i)) if (kind[j] === CLUSTER) options.push(j);
  return options[Math.floor(rng() * options.length)];
}

function grow() {
  let total = 0;
  const cumulative = new Float64Array(cand.length);
  for (let k = 0; k < cand.length; k++) {
    const c = cand[k], p = phi[c];
    // Weight by field^eta, not potential^eta: a diagonal-only candidate is √2 away from the
    // cluster. Using the potential made figures grow as an X along the diagonals.
    const field = touchesClusterOrthogonally(c) ? p : p * Math.SQRT1_2;
    total += p > 0 ? Math.pow(field, eta) : 0;
    cumulative[k] = total;
  }
  if (total <= 0) { done = true; return -1; }
  const r = rng() * total;
  let lo = 0, hi = cand.length - 1;
  while (lo < hi) { const m = (lo + hi) >> 1; if (cumulative[m] < r) lo = m + 1; else hi = m; }
  const i = cand[lo];
  addToCluster(i, pickParent(i));
  relaxAround(i);
  if (++steps % GLOBAL_SWEEP_EVERY === 0) sweep(1, 1, W - 2, H - 2);
  return i;
}

// A fixed per-cell offset hides the grid's staircase. Integer hash with the golden-ratio
// multiplier and the MurmurHash3 finalizer constant.
function jitter(i, salt) {
  let h = Math.imul(i ^ salt, 0x9E3779B1); h ^= h >>> 15; h = Math.imul(h, 0x85EBCA77); h ^= h >>> 13;
  return ((h >>> 0) / 4294967296 - 0.5) * 0.8;
}
function toCanvas(i) {
  return [offX + (i % W + 0.5 + jitter(i, 0x51)) * cell, offY + (((i / W) | 0) + 0.5 + jitter(i, 0xA7)) * cell];
}

function segment(i, width, color) {
  const [x0, y0] = toCanvas(parent[i]), [x1, y1] = toCanvas(i);
  ctx.strokeStyle = color; ctx.lineWidth = width;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
}

function drawNew(list) {
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  for (const i of list) segment(i, cell * 1.6, 'rgba(255,40,20,0.22)');
  for (const i of list) segment(i, Math.max(1, cell * 0.4), 'rgba(255,170,165,0.9)');
  ctx.globalCompositeOperation = 'source-over';
}

function finish() {
  done = true;
  // Branches carrying more current are thicker; current ~ number of cells downstream.
  downstream = new Uint32Array(W * H);
  for (let k = order.length - 1; k > 0; k--) { const i = order[k]; downstream[i] += 1; downstream[parent[i]] += downstream[i]; }
  mainChannel = [];
  if (strike >= 0) for (let i = strike; i >= 0 && parent[i] >= 0; i = parent[i]) mainChannel.push(i);
  flash = 1;
  if (audio) playThunder();
}

// Thunder as the sum of the N-waves emitted by every piece of the channel (the tortuous channel
// model of Few 1969, https://doi.org/10.1029/JB074i027p06926). Each piece is heard after
// distance / speed of sound, so a stretch that runs across the listener's line of sight arrives
// all at once (a clap) and a stretch pointing at the listener is spread out (the rumble).
// The screen is a vertical slice of sky; the listener stands on the ground below its center,
// LISTENER_OFFSET_M out of the screen.
const SOUND_SPEED = 343;
const SKY_HEIGHT_M = 3000;
const LISTENER_OFFSET_M = 1000;
const SAMPLE_RATE = 44100;

let audio = null, thunderSource = null, thunderStart = -1, thunderEmitters = null, thunderLead = 0;

function metersPerCell() { return SKY_HEIGHT_M / H; }

// Meters from the listener's feet, which are at the bottom center of the screen.
function groundPosition(i) {
  const m = metersPerCell();
  return [(i % W + 0.5 + jitter(i, 0x51) - W / 2) * m, (H - ((i / W) | 0) - 0.5 - jitter(i, 0xA7)) * m];
}

// One emitter every EMITTER_SPACING_M along each piece: one per grid cell left gaps of silence
// between arrivals and the thunder crackled like a fire.
const EMITTER_SPACING_M = 2;
// With the loudness-curve match below: farther stretches fade fast enough that the first arrival dominates.
const ABSORPTION_M = 400;
const RETURN_STROKE_BOOST = 2;
const RETURN_STROKE_DECAY_M = 600;

function synthesizeThunder() {
  const maxLog = Math.log(order.length + 1);
  const onMain = new Set(mainChannel);
  const emitters = [];
  let nearest = Infinity, farthest = 0;
  for (let k = 1; k < order.length; k++) {
    const i = order[k];
    // The return stroke carries the most current near the ground and weakens going up, so the bottom of
    // the main channel is the crack you hear first. Without this the thunder swelled in instead of striking.
    const height = groundPosition(i)[1];
    const t = onMain.has(i) ? 1.6 * (1 + RETURN_STROKE_BOOST * Math.exp(-height / RETURN_STROKE_DECAY_M))
      : Math.log(downstream[i] + 1) / maxLog;
    // Weak twigs would cost time and add only hiss.
    if (t < 0.25) continue;
    const [x0, y0] = groundPosition(parent[i]), [x1, y1] = groundPosition(i);
    const n = Math.max(1, Math.round(Math.hypot(x1 - x0, y1 - y0) / EMITTER_SPACING_M));
    for (let s = 1; s <= n; s++) {
      const r = Math.hypot(x0 + (x1 - x0) * s / n, y0 + (y1 - y0) * s / n, LISTENER_OFFSET_M);
      emitters.push({ i, r, t, w: 1 / n });
      nearest = Math.min(nearest, r); farthest = Math.max(farthest, r);
    }
  }
  const lead = nearest / SOUND_SPEED;
  const samples = new Float32Array(Math.ceil(((farthest - nearest) / SOUND_SPEED + 0.6) * SAMPLE_RATE));
  for (const e of emitters) {
    // Few's relaxation radius: a stronger stroke heats a wider column, whose N-wave is longer and lower.
    // Real channels are a few meters; kept smaller so the N-waves (3 to 12 ms) land where a phone
    // speaker still plays. The slow pulsing of the claps adds the deep part anyway.
    const relaxRadius = 0.3 + 0.8 * e.t;
    const half = Math.max(8, Math.round(1.3 * relaxRadius / SOUND_SPEED * SAMPLE_RATE));
    // The air eats high frequencies with distance; widen the shock fronts instead of filtering.
    const rise = Math.max(2, Math.round((0.0003 + 0.0005 * e.r / 1000) * SAMPLE_RATE));
    // Emitters 2 m apart with identical pulses arrive at regular intervals and ring as a buzzing
    // pitch (a comb). Real channels are tortuous below 2 m too: scatter each arrival by up to ±2 ms.
    const scatter = jitter(e.i, Math.round(e.r * 7)) * 2.5 * 0.002 * SAMPLE_RATE;
    // Beyond 1/r spreading, the air absorbs more on a longer path: the first arrival is the crack and
    // the far end of the channel only rumbles.
    const absorbed = Math.exp(-(e.r - nearest) / ABSORPTION_M);
    const amp = e.w * e.t * e.t / e.r * absorbed * (1 + jitter(e.i, Math.round(e.r * 13)));
    const at = Math.max(0, Math.round((e.r / SOUND_SPEED - lead) * SAMPLE_RATE + scatter));
    for (let s = 0; s < 2 * half + rise && at + s < samples.length; s++) {
      const ramp = Math.min(1, s / rise, (2 * half + rise - s) / rise);
      samples[at + s] += amp * ramp * (1 - s / half);
    }
  }
  mixRumble(samples);
  let peak = 0;
  for (const v of samples) peak = Math.max(peak, Math.abs(v));
  // Gentle soft clip only: real thunder is a loud crack then quieter claps, and squashing that flat
  // turned it into a steady roar.
  const fadeFrom = samples.length - FADE_OUT_S * SAMPLE_RATE;
  for (let s = 0; s < samples.length; s++) {
    const fade = s < fadeFrom ? 1 : (samples.length - s) / (FADE_OUT_S * SAMPLE_RATE);
    samples[s] = fade * Math.tanh(0.8 * samples[s] / peak) / Math.tanh(0.8);
  }
  return { samples, lead, emitters };
}

// The N-waves alone are a train of clicks: real channels have countless kinks below any grid, and their
// pulses blur into noise. So the rumble is dark noise shaped by the loudness of the N-wave train.
// Tuned by comparing spectrograms with real recordings (Wikimedia Commons "Thunder 01", "Thunder crack 2B").
// What they have and a smooth roar lacks: a few distinct claps, broadband and short, with the roar
// sinking between them. Here the claps sit on the strongest peaks of the arrival envelope, which are the
// stretches of channel lying across the line of sight (Few's claps); the roar follows env^ROAR_CONTRAST.
const ROAR_SMOOTH_S = 0.12;
const ROAR_CONTRAST = 1.8;
const CLAPS = 6;
// Levels set by matching the loudness curve of "Thunder crack 2B" (RMS per 0.25 s): one hit, about
// -10 dB after 2 s, a tail near -20 dB at 7 s. Louder claps and roar made a 3 s plateau, a stream
// of sound instead of a strike.
const CLAP_LEVEL = 0.2;
const CLAP_DECAY_S = 1.5;
const ROAR_LEVEL = 0.25;
const CLAP_GAP_S = 0.35;
const CRACKLE_LEVEL = 0.15;
const FADE_OUT_S = 0.5;

function mixRumble(samples) {
  const slow = 1 / (ROAR_SMOOTH_S * SAMPLE_RATE);
  const lowPole = Math.exp(-2 * Math.PI * 250 / SAMPLE_RATE), dcPole = Math.exp(-2 * Math.PI * 40 / SAMPLE_RATE);
  const env = new Float32Array(samples.length), roarBand = new Float32Array(samples.length);
  let level = 0, low1 = 0, low = 0, lastLow = 0, roar = 0, roarPeak = 1e-12, crackPeak = 1e-12;
  for (let s = 0; s < samples.length; s++) {
    level += (Math.abs(samples[s]) - level) * slow;
    env[s] = level;
    // Two poles: with one, the roar kept a -6 dB/octave tail of hiss up to 2 kHz for its whole length.
    low1 = lowPole * low1 + (1 - lowPole) * (Math.random() * 2 - 1);
    low = lowPole * low + (1 - lowPole) * low1;
    roar = dcPole * (roar + low - lastLow); lastLow = low;
    roarBand[s] = roar * level ** ROAR_CONTRAST;
    roarPeak = Math.max(roarPeak, Math.abs(roarBand[s])); crackPeak = Math.max(crackPeak, Math.abs(samples[s]));
  }
  for (let s = 0; s < samples.length; s++) samples[s] = CRACKLE_LEVEL * samples[s] / crackPeak + ROAR_LEVEL * roarBand[s] / roarPeak;
  addCrack(samples, 0, 1);
  for (const [at, height] of clapTimes(env)) addCrack(samples, at, CLAP_LEVEL * height * Math.exp(-at / SAMPLE_RATE / CLAP_DECAY_S));
}

// The CLAPS highest local maxima of the envelope, at least CLAP_GAP_S apart, skipping the opening
// crack; heights are relative to the highest one.
function clapTimes(env) {
  const gap = Math.round(CLAP_GAP_S * SAMPLE_RATE), step = Math.round(0.01 * SAMPLE_RATE);
  const peaks = [];
  for (let s = gap; s < env.length - step; s += step) {
    if (env[s] >= env[s - step] && env[s] > env[s + step]) peaks.push(s);
  }
  peaks.sort((a, b) => env[b] - env[a]);
  const picked = [];
  for (const s of peaks) {
    if (picked.length === CLAPS) break;
    if (picked.some((p) => Math.abs(p - s) < gap)) continue;
    picked.push(s);
  }
  const top = picked.length ? env[picked[0]] : 1;
  return picked.map((s) => [s, env[s] / top]);
}

// Real recordings open with a crack: the shock wave of the nearest piece of channel, broadband and the
// loudest moment, dying into the roar within about a second. The emitters alone gave a slow swell,
// since the nearest piece is short. White noise for the snap, dark noise for its body. Claps are
// smaller copies of it.
const CRACK_S = 1;
const CRACK_LEVEL = 2.5;

function addCrack(samples, at, scale) {
  const n = Math.min(samples.length - at, Math.round(CRACK_S * SAMPLE_RATE));
  let dark = 0;
  for (let s = 0; s < n; s++) {
    const t = s / SAMPLE_RATE, white = Math.random() * 2 - 1;
    dark = 0.95 * dark + 0.05 * white;
    const snap = Math.exp(-t / 0.05), body = Math.exp(-t / 0.3);
    samples[at + s] += scale * CRACK_LEVEL * Math.min(1, s / 40) * (0.6 * snap * white + body * 4 * dark);
  }
}

function playThunder() {
  if (!mainChannel.length) return;
  const { samples, lead, emitters } = synthesizeThunder();
  const buffer = audio.createBuffer(1, samples.length, SAMPLE_RATE);
  buffer.copyToChannel(samples, 0);
  stopThunder();
  thunderSource = audio.createBufferSource();
  thunderSource.buffer = buffer;
  thunderSource.connect(thunderOutput());
  // The light arrives now, the sound after lead seconds: the old count-the-seconds rule, for real.
  thunderSource.start(audio.currentTime + lead);
  thunderStart = audio.currentTime;
  thunderEmitters = emitters;
  thunderLead = lead;
}

// At a kilometre the air has eaten most of the highs, and the sound reaches you again off the ground,
// hills and clouds for seconds. Low-pass, then a long reverb made of decaying dark noise. The cutoff is
// higher than physics says because phone speakers play almost nothing below ~200 Hz, where thunder lives.
// Built once per audio context.
const THUNDER_CUTOFF_HZ = 2500;
const ECHO_SECONDS = 7;
const ECHO_CUTOFF_HZ = 300;
let thunderBus = null;

function thunderOutput() {
  if (thunderBus && thunderBus.context === audio) return thunderBus;
  // Below ~45 Hz no phone plays anything; that energy only ate headroom and made the rest quieter.
  const highpass = audio.createBiquadFilter();
  highpass.type = 'highpass'; highpass.frequency.value = 45; highpass.Q.value = 0.7;
  const lowpass = audio.createBiquadFilter();
  lowpass.type = 'lowpass'; lowpass.frequency.value = THUNDER_CUTOFF_HZ; lowpass.Q.value = 0.5;
  highpass.connect(lowpass);
  const reverb = audio.createConvolver();
  reverb.buffer = echoImpulse();
  const dry = audio.createGain(), wet = audio.createGain();
  dry.gain.value = 0.8; wet.gain.value = 0.4;
  lowpass.connect(dry).connect(audio.destination);
  // Echoes travel kilometres more than the direct sound, so only the lows come back; a bright reverb
  // smeared the claps into a hiss that never stopped.
  const echoTone = audio.createBiquadFilter();
  echoTone.type = 'lowpass'; echoTone.frequency.value = ECHO_CUTOFF_HZ; echoTone.Q.value = 0.5;
  lowpass.connect(echoTone).connect(reverb).connect(wet).connect(audio.destination);
  thunderBus = highpass;
  return highpass;
}

// Brown noise under an exponential decay: echoes get denser and darker as they come from farther away.
// A ConvolverNode throws unless its buffer has the context's own sample rate (48 kHz on most phones),
// so this one is built at audio.sampleRate, not SAMPLE_RATE.
function echoImpulse() {
  const rate = audio.sampleRate, n = Math.round(ECHO_SECONDS * rate);
  const ir = audio.createBuffer(1, n, rate), data = ir.getChannelData(0);
  let brown = 0;
  for (let s = 0; s < n; s++) {
    brown = 0.95 * brown + 0.3 * (Math.random() * 2 - 1);
    data[s] = brown * Math.exp(-2 * s / n) * Math.min(1, s / (0.04 * rate));
  }
  return ir;
}

function stopThunder() {
  if (thunderSource) thunderSource.stop();
  thunderSource = null; thunderStart = -1; thunderEmitters = null;
}

function thunderRadius() {
  if (!audio || thunderStart < 0 || !thunderEmitters) return -1;
  return (audio.currentTime - thunderStart) * SOUND_SPEED;
}

// The sound reaching the listener now left from the points on a sphere around them; its slice
// through the screen is a circle around the point below their feet.
function drawWavefront() {
  const r = thunderRadius();
  const last = thunderEmitters ? thunderEmitters.reduce((a, e) => Math.max(a, e.r), 0) : 0;
  if (r < 0 || r > last + 50) return false;
  const footX = offX + W / 2 * cell, footY = offY + H * cell;
  // Drawn above the bottom bar, not at the true feet, so it stays visible.
  const markY = footY - 64 * dpr;
  ctx.fillStyle = 'rgba(160,200,255,0.9)';
  ctx.beginPath(); ctx.arc(footX, markY, 4 * dpr, 0, 7); ctx.fill();
  // Count the seconds between flash and sound, as people do: about 3 per kilometer.
  const heard = r >= thunderLead * SOUND_SPEED;
  const label = heard ? `${thunderLead.toFixed(1)} s → ${(thunderLead * SOUND_SPEED / 1000).toFixed(1)} km` : `${Math.floor(r / SOUND_SPEED)} s…`;
  ctx.font = `${12 * dpr}px ui-monospace, Menlo, monospace`;
  ctx.textAlign = 'center';
  ctx.fillText(label, footX, markY - 10 * dpr);
  if (r <= LISTENER_OFFSET_M) return true;
  const inPlane = Math.sqrt(r * r - LISTENER_OFFSET_M * LISTENER_OFFSET_M) / metersPerCell() * cell;
  ctx.strokeStyle = 'rgba(160,200,255,0.25)'; ctx.lineWidth = Math.max(1, cell * 0.5);
  ctx.beginPath(); ctx.arc(footX, footY, inPlane, 0, 7); ctx.stroke();
  // Light up what you are hearing right now: the pieces within 30 ms of travel from the front.
  ctx.fillStyle = 'rgba(190,220,255,0.9)';
  for (const e of thunderEmitters) {
    if (Math.abs(e.r - r) > 10) continue;
    const [x, y] = toCanvas(e.i);
    ctx.beginPath(); ctx.arc(x, y, cell * (0.6 + e.t), 0, 7); ctx.fill();
  }
  return true;
}

function drawBranches(dim) {
  const maxLog = Math.log(order.length + 1);
  const thickness = i => Math.log(downstream[i] + 1) / maxLog;  // 0 at tips, 1 at the trunk
  const width = t => cell * (0.3 + 1.7 * t * t);
  for (let k = 1; k < order.length; k++) {
    const i = order[k], t = thickness(i);
    segment(i, width(t) * 3.2, `rgba(255,${20 + 30 * t | 0},${20 + 20 * t | 0},${(0.10 + 0.22 * t) * dim})`);
  }
  for (let k = 1; k < order.length; k++) {
    const i = order[k], t = thickness(i);
    segment(i, width(t), `rgba(255,${70 + 170 * t * t | 0},${70 + 170 * t * t | 0},${(0.45 + 0.5 * t) * dim})`);
  }
}

function drawMainChannel() {
  if (!mainChannel.length) return;
  const glow = 0.6 + 0.4 * flash;
  for (const [wd, col] of [[cell * 9, `rgba(255,40,30,${0.10 * glow})`], [cell * 4, `rgba(255,90,70,${0.30 * glow})`], [cell * 1.4, `rgba(255,255,255,${0.95 * glow})`]]) {
    ctx.strokeStyle = col; ctx.lineWidth = wd; ctx.lineJoin = 'round';
    ctx.beginPath();
    let [x, y] = toCanvas(mainChannel[0]); ctx.moveTo(x, y);
    for (const i of mainChannel.slice(1)) { [x, y] = toCanvas(i); ctx.lineTo(x, y); }
    [x, y] = toCanvas(src); ctx.lineTo(x, y);
    ctx.stroke();
  }
}

function drawIgnitionPoint() {
  const [sx, sy] = toCanvas(src);
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.beginPath(); ctx.arc(sx, sy, cell * 1.6, 0, 7); ctx.fill();
}

function drawFinal() {
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (flash > 0) { ctx.fillStyle = `rgba(255,220,220,${0.18 * flash})`; ctx.fillRect(0, 0, canvas.width, canvas.height); }
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  drawBranches(1 - 0.55 * Math.min(1, fadeT));
  drawMainChannel();
  drawIgnitionPoint();
  ctx.globalCompositeOperation = 'source-over';
  return drawWavefront();
}

let last = 0, quota = 0, listening = false;
function frame(now) {
  const dt = Math.min(0.1, (now - (last || now)) / 1000); last = now;
  if (!done) {
    const t0 = performance.now(), fresh = [];
    // Growth speed follows wall time, not frame rate; slow devices drop growths, not seconds.
    quota = Math.min(quota + dt * GROWTHS_PER_SECOND, GROWTHS_PER_SECOND * 0.25);
    while (quota >= 1 && performance.now() - t0 < FRAME_BUDGET_MS) {
      quota--;
      const i = grow();
      if (i < 0) break;
      fresh.push(i);
      if (strike >= 0) break;
    }
    drawNew(fresh);
    if (strike >= 0 || done) { finish(); listening = drawFinal(); }
  } else if (mainChannel && (flash > 0 || fadeT < 1 || listening)) {
    flash = Math.max(0, flash - dt * 2.5);
    if (flash === 0) fadeT = Math.min(1, fadeT + dt * 0.8);
    listening = drawFinal();
  }
  requestAnimationFrame(frame);
}

canvas.addEventListener('pointerdown', e => {
  const gx = (e.clientX * dpr - offX) / (W * cell), gy = (e.clientY * dpr - offY) / (H * cell);
  params.x = Math.min(0.95, Math.max(0.05, gx)); params.y = Math.min(0.95, Math.max(0.05, gy));
  params.seed = Math.floor(Math.random() * 1e9) >>> 0;
  hint.style.opacity = 0;
  start();
});

const soundToggle = document.getElementById('sound');
soundToggle.addEventListener('click', e => {
  e.preventDefault();
  // Browsers only allow audio started from a tap, so the context is born here.
  if (!audio) {
    audio = new AudioContext();
    soundToggle.textContent = '🔊 tuono';
    if (mainChannel) { playThunder(); listening = true; }
    return;
  }
  stopThunder(); audio.close(); audio = null;
  soundToggle.textContent = '🔇 tuono';
});

slider.addEventListener('input', () => { etaLabel.textContent = (+slider.value).toFixed(1); });
// Keep seed and point on purpose: the same figure with a different eta shows what eta does.
slider.addEventListener('change', () => { params.eta = +slider.value; start(); });

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    layout();
    if (mainChannel) { drawFinal(); return; }
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    drawNew(order.slice(1));
  }, 150);
});

setTimeout(() => { hint.style.opacity = 0; }, 4000);
start();
requestAnimationFrame(frame);
</script>
</body>
</html>
